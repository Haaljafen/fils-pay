# Cap concurrent API requests: past what 0.5 vCPU can serve (~10 checkouts/s, ~8-10 concurrent shoppers
# at p95 ~1.2 s) extra requests are turned away at once with a 503 + Retry-After, instead of queueing for
# 10+ seconds and failing with 500s.
limit_conn_zone $server_name zone=api_conns:1m;
limit_conn_status 503;
# Password guessing: the password step of merchant and admin login had no limit at all. 10 attempts/minute per
# client IP (burst 10) is plenty for a person and stops a guessing script; it also bounds argon2 CPU burn.
limit_req_zone $binary_remote_addr zone=login_req:1m rate=10r/m;
limit_req_status 429;

server {
  listen 80;
  # Self-signed certificate for the server's IP (ops/certs, generated on the host, never committed). Replace
  # with a real certificate once there is a domain.
  listen 443 ssl;
  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  # Re-resolve "api" through Docker's DNS instead of once at start-up: when the api container is recreated
  # or restarts with a new address nginx used to keep proxying to the dead one (502 until restarted).
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:3000;
  root /usr/share/nginx/html;
  error_page 503 @busy;
  location @busy {
    add_header Retry-After 2 always;
    default_type application/json;
    return 503 '{"error":"server_busy","message":"too many requests, retry shortly"}';
  }
  location ~ ^/v1/(admin/)?auth/(login|register)$ {
    limit_req zone=login_req burst=10 nodelay;
    limit_conn api_conns 24;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /v1/ {
    limit_conn api_conns 24;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location /healthz { proxy_pass $api_upstream; }
  # File names under /assets/ change with every build. A missing one must be a 404: answering with index.html
  # gave a browser holding an older page HTML where it expected a script, and it rendered nothing.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Without this a browser may reuse index.html without asking, and that older page names files a rebuild removed.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
